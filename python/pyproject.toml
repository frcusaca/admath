[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vecdraw"
version = "0.4.0"
description = "A tiny, readable helper for drawing vectors, plus the Angle Explorer, for the linalg-circle course."
readme = "README.md"
authors = [{ name = "CAehi.us" }]
license = "LicenseRef-Prosperity-3.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# IPython is already present in Jupyter and Colab; it is only needed to *display* the explorer.
notebook = ["ipython>=8"]
dev = ["ipython>=8", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/vecdraw"]

[tool.hatch.build.targets.sdist]
include = ["src/vecdraw", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
